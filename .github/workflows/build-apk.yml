name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require tooling
        run: |
          set -e
          test -f tooling/AndroidManifest.xml
          test -f tooling/MainActivity.kt
          test -f tooling/release.jks
          test -f tooling/key.properties
          test -f tooling/inject_signing.py
          grep -q READ_PHONE_STATE tooling/AndroidManifest.xml
          echo "tooling OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter create + permissions + same package id
        run: |
          set -e
          flutter config --no-analytics || true
          flutter create --project-name customer_callbook --org ir.apadanasleep --platforms=android .
          mkdir -p assets/icons assets/images
          touch assets/images/.gitkeep

          cp -f tooling/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # MainActivity under package matching applicationId
          mkdir -p android/app/src/main/kotlin/ir/apadanasleep/customer_callbook
          # package line must match folder
          cp -f tooling/MainActivity.kt android/app/src/main/kotlin/ir/apadanasleep/customer_callbook/MainActivity.kt
          find android -name MainActivity.kt | grep -v customer_callbook | xargs -r rm -f || true


          # Force stable applicationId (same as already on phone)
          python3 << 'PY'
from pathlib import Path
import re
for name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
    p = Path(name)
    if not p.exists():
        continue
    t = p.read_text()
    t = re.sub(r'applicationId\s*=\s*["\'][^"\']+["\']', 'applicationId = "ir.apadanasleep.customer_callbook"', t)
    t = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "ir.apadanasleep.customer_callbook"', t)
    t = re.sub(r'namespace\s*=\s*["\'][^"\']+["\']', 'namespace = "ir.apadanasleep.customer_callbook"', t)
    t = re.sub(r'namespace\s+"[^"]+"', 'namespace "ir.apadanasleep.customer_callbook"', t)
    p.write_text(t)
    print(name, "-> ir.apadanasleep.customer_callbook")
PY
          echo "applicationId fixed"
          cat android/app/src/main/AndroidManifest.xml | head -20

      - name: Icon + SDK 35
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick || true
          if [ -f assets/icons/app_icon.png ]; then
            for folder in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $folder in
                mdpi) size=48 ;;
                hdpi) size=72 ;;
                xhdpi) size=96 ;;
                xxhdpi) size=144 ;;
                xxxhdpi) size=192 ;;
              esac
              dir="android/app/src/main/res/mipmap-$folder"
              mkdir -p "$dir"
              convert assets/icons/app_icon.png -resize ${size}x${size} "$dir/ic_launcher.png" 2>/dev/null \
                || cp assets/icons/app_icon.png "$dir/ic_launcher.png"
              cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png" 2>/dev/null || true
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          fi
          find android -name "build.gradle*" -type f | while read f; do
            sed -i -E 's/compileSdk(Version)?[[:space:]=]+[0-9]+/compileSdk = 35/g' "$f" || true
            sed -i -E 's/targetSdk(Version)?[[:space:]=]+[0-9]+/targetSdk = 35/g' "$f" || true
          done


      - name: Force compileSdk 35
        run: |
          set -e
          find android -name 'build.gradle*' -type f | while read f; do
            sed -i -E 's/compileSdk(Version)?[[:space:]=]+[0-9]+/compileSdk = 35/g' "$f" || true
            sed -i -E 's/targetSdk(Version)?[[:space:]=]+[0-9]+/targetSdk = 35/g' "$f" || true
            grep -q 'compileSdk' "$f" || sed -i '/android[[:space:]]*{/a\    compileSdk = 35' "$f" || true
            echo "patched $f"
            grep -E 'compileSdk|targetSdk' "$f" || true
          done

      - name: pub get + manifest again
        run: |
          set -e
          flutter pub get
          cp -f tooling/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # Dart channel must match MainActivity
          find lib -name "*.dart" -print0 | xargs -0 sed -i \
            's|ir.apadanasleep.daftarche/call_log|ir.apadanasleep.customer_callbook/call_log|g' || true

      - name: Install widget resources (hard)
        run: |
          set -e
          RES=android/app/src/main/res
          mkdir -p "$RES/xml" "$RES/layout" "$RES/drawable" "$RES/values"
          cat > "$RES/values/strings.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">فروشیار</string>
              <string name="widget_name">فروشیار</string>
              <string name="widget_description">تماس‌های امروز فروشیار</string>
          </resources>
          EOF
          # strip leading spaces from heredoc indent
          python3 - <<'PY'
from pathlib import Path
p = Path('android/app/src/main/res/values/strings.xml')
lines = [ln[10:] if ln.startswith('          ') else ln for ln in p.read_text().splitlines(True)]
p.write_text(''.join(lines))
print('strings', p.stat().st_size)
PY
          cat > "$RES/xml/daftarche_widget_info.xml" << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
    android:minWidth="180dp"
    android:minHeight="110dp"
    android:updatePeriodMillis="1800000"
    android:initialLayout="@layout/daftarche_widget"
    android:resizeMode="horizontal|vertical"
    android:widgetCategory="home_screen"
    android:description="@string/widget_description" />
EOF
          cat > "$RES/layout/daftarche_widget.xml" << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:id="@+id/widget_root"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:padding="16dp"
    android:background="@drawable/widget_bg">
    <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
        android:text="فروشیار" android:textColor="#FFFFFF" android:textSize="13sp" android:textStyle="bold"/>
    <TextView android:id="@+id/widget_count" android:layout_width="wrap_content" android:layout_height="wrap_content"
        android:text="0" android:textColor="#FFFFFF" android:textSize="12sp"/>
    <TextView android:id="@+id/widget_line1" android:layout_width="match_parent" android:layout_height="wrap_content"
        android:layout_marginTop="8dp" android:text="تماس امروزی ثبت نشده" android:textColor="#FFFFFF" android:textSize="12sp"/>
    <TextView android:id="@+id/widget_line2" android:layout_width="match_parent" android:layout_height="wrap_content"
        android:text="" android:textColor="#B0B8C8" android:textSize="12sp"/>
    <TextView android:id="@+id/widget_line3" android:layout_width="match_parent" android:layout_height="wrap_content"
        android:text="" android:textColor="#B0B8C8" android:textSize="12sp"/>
</LinearLayout>
EOF
          cat > "$RES/drawable/widget_bg.xml" << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
    <solid android:color="#1A1730"/>
    <corners android:radius="16dp"/>
</shape>
EOF
          cat > "$RES/drawable/widget_badge.xml" << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
    <solid android:color="#6C63FF"/>
    <corners android:radius="10dp"/>
</shape>
EOF
          ls -la "$RES/xml" "$RES/layout" "$RES/drawable" "$RES/values"
          test -f "$RES/xml/daftarche_widget_info.xml"
          test -f "$RES/layout/daftarche_widget.xml"
          echo "HARD widget resources installed"

      - name: Build APK
        run: |
          set -e
          KT=android/app/src/main/kotlin/ir/apadanasleep/customer_callbook
          mkdir -p "$KT"
          test -f tooling/MainActivity.kt
          cp -f tooling/MainActivity.kt "$KT/MainActivity.kt"
          # remove stale separate classes (all live in MainActivity.kt now)
          rm -f "$KT"/CallMonitorService.kt "$KT"/CallOverlayService.kt "$KT"/CallAlertActivity.kt \
                "$KT"/PhoneStateReceiver.kt "$KT"/BootReceiver.kt "$KT"/DaftarcheWidgetProvider.kt
          cp -f tooling/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          python3 tooling/prepare_android.py
          python3 tooling/ensure_widget.py
          python3 tooling/inject_signing.py
          # force SDK 35 everywhere
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties || true
          find android -name "build.gradle*" -type f | while read f; do
            sed -i 's/flutter.compileSdkVersion/35/g' "$f"
            sed -i 's/flutter.targetSdkVersion/35/g' "$f"
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 35/g' "$f"
            sed -i -E 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 35/g' "$f"
          done
          # force SDK 35
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' "$f"
              sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' "$f"
              sed -i -E 's/compileSdk(Version)?[[:space:]=]+[^[:space:]]+/compileSdk = 35/g' "$f"
              sed -i -E 's/targetSdk(Version)?[[:space:]=]+[^[:space:]]+/targetSdk = 35/g' "$f"
              grep -n "compileSdk\|targetSdk" "$f" || true
            fi
          done
          # verify all classes in one file
          for cls in MainActivity CallMonitorService CallOverlayService CallAlertActivity PhoneStateReceiver BootReceiver DaftarcheWidgetProvider; do
            grep -q "class $cls" "$KT/MainActivity.kt" || { echo "MISSING class $cls"; exit 1; }
          done
          grep -q CallMonitorService android/app/src/main/AndroidManifest.xml
          grep -q CallOverlayService android/app/src/main/AndroidManifest.xml
                    grep -q "class DaftarcheWidgetProvider" "$KT/MainActivity.kt"
                    echo "widget resources OK"
          # final guarantee before aapt
          python3 tooling/prepare_android.py || true
          RES=android/app/src/main/res
          mkdir -p "$RES/xml" "$RES/layout" "$RES/drawable" "$RES/values"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"' '    android:minWidth="180dp"' '    android:minHeight="110dp"' '    android:updatePeriodMillis="1800000"' '    android:initialLayout="@layout/daftarche_widget"' '    android:resizeMode="horizontal|vertical"' '    android:widgetCategory="home_screen"' '    android:description="@string/widget_description" />' > "$RES/xml/daftarche_widget_info.xml"
          test -s "$RES/xml/daftarche_widget_info.xml"
          test -s "$RES/layout/daftarche_widget.xml"
          ls -la "$RES/xml"
          echo "pre-build checks OK"
          python3 tooling/ensure_widget.py
          grep -q DaftarcheWidgetProvider android/app/src/main/AndroidManifest.xml || { echo "widget receiver missing"; exit 1; }
          test -f android/app/src/main/res/xml/daftarche_widget_info.xml
          echo "widget registered in manifest"
          python3 tooling/inject_signing.py
          grep -q "signingConfigs.release" android/app/build.gradle || { echo "signingConfigs missing"; cat android/app/build.gradle; exit 1; }
          test -f android/app/release.jks
                    # فقط نسخه شخصی بدون محدودیت (فعلاً)
          flutter build apk --release --dart-define=FOROSHYAR_CHANNEL=personal
          cp -f build/app/outputs/flutter-apk/app-release.apk /tmp/personal-unsigned.apk
          ls -la /tmp/personal-unsigned.apk
          echo "PERSONAL unlimited APK ready"

      - name: Re-sign release keystore
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq aapt unzip zip
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "build-tools=$BT"
          test -f tooling/release.jks
          test -f /tmp/personal-unsigned.apk

          # Unpack, strip ALL signatures, repack, zipalign, sign with release.jks
          rm -rf /tmp/apk_work
          mkdir -p /tmp/apk_work
          unzip -q /tmp/personal-unsigned.apk -d /tmp/apk_work
          rm -rf /tmp/apk_work/META-INF
          # ensure not debuggable
          if [ -f /tmp/apk_work/AndroidManifest.xml ]; then
            echo "manifest binary present (ok)"
          fi
          (
            cd /tmp/apk_work
            zip -q -r -9 /tmp/unsigned_clean.apk .
          )
          "$BT/zipalign" -f -p 4 /tmp/unsigned_clean.apk /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks tooling/release.jks \
            --ks-key-alias customer_callbook \
            --ks-pass pass:callbook2026 \
            --key-pass pass:callbook2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out /tmp/signed.apk \
            /tmp/aligned.apk

          mkdir -p build/app/outputs/flutter-apk
          cp -f /tmp/signed.apk build/app/outputs/flutter-apk/foroshyar-personal.apk
          cp -f /tmp/signed.apk build/app/outputs/flutter-apk/app-release.apk

          echo "==== CERTIFICATE (must be Customer Callbook, NOT Android Debug) ===="
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/foroshyar-personal.apk | tee /tmp/certs.txt
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "ERROR: still debug-signed — abort upload"
            exit 1
          fi
          if ! grep -qi "Customer Callbook" /tmp/certs.txt; then
            echo "ERROR: expected CN=Customer Callbook not found"
            cat /tmp/certs.txt
            exit 1
          fi
          echo "SUCCESS release-signed foroshyar-personal.apk"
          aapt dump badging build/app/outputs/flutter-apk/foroshyar-personal.apk | grep -E "package:|version|application-label" | head -8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-callbook-apk
          path: |
            build/app/outputs/flutter-apk/foroshyar-personal.apk
            build/app/outputs/flutter-apk/app-release.apk
